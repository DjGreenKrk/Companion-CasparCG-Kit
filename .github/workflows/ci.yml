name: CI

# Module: formatting, unit tests, package. Skills: versions agree across SKILL.md / plugin.json /
# marketplace.json, the skill scripts run, the starter graphics pass their own linter.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clean install from the lockfile
        run: |
          npm ci --no-audit --no-fund
          pip install pyyaml
      - name: Formatting
        run: npx prettier --check src test index.js
      - name: Unit tests
        run: npm test
      - name: Skill versions and Agent Skills rules
        run: python3 tools/build_release.py --check
      - name: Skill scripts
        run: |
          python3 -m py_compile skills/*/scripts/*.py
          node --check skills/event-lower-third-generator/assets/kit/gfx.js
          starter=$(mktemp -d)
          cp -r skills/event-lower-third-generator/assets/starter/. "$starter"
          cp -r skills/event-lower-third-generator/assets/kit "$starter/kit"
          python3 skills/event-lower-third-generator/scripts/check_graphics.py "$starter"
          python3 skills/event-lower-third-generator/scripts/palette.py --contrast "#10180a" "#c8ff67"
      - name: Build the Companion package and the release assets
        run: |
          npm run build
          python3 tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
          retention-days: 14

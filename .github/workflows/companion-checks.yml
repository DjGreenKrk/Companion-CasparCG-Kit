name: Companion module checks

# The rules of Bitfocus' module checks (bitfocus/actions, module-checks.yaml), written for this
# repository. Their workflow also requires the repository to be named companion-module-<id> with the
# same manifest id, which a kit repository with skills cannot meet; everything else is checked here
# the same way: yarn lockfile, @companion-module/tools minimum, manifest and HELP, version = tag,
# build with companion-module-build, and the built module loads the way Companion loads it.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  companion:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Node.js version from the manifest runtime
        id: node
        run: |
          runtime=$(node -p "require('./companion/manifest.json').runtime.type")
          case "$runtime" in
            node18) echo "version=18" >> "$GITHUB_OUTPUT" ;;
            node22) echo "version=22" >> "$GITHUB_OUTPUT" ;;
            node26) echo "version=26" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::runtime.type '$runtime' is not node18 / node22 / node26"; exit 1 ;;
          esac
      - run: corepack enable
      # @companion-module/tools 3 builds on Node 22 (engines ^22.18); the module itself runs on the manifest runtime
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Yarn, not npm
        run: |
          if [ -f package-lock.json ]; then echo "::error::package-lock.json found - Companion modules use yarn"; exit 1; fi
          if [ ! -f yarn.lock ]; then echo "::error::yarn.lock missing"; exit 1; fi

      - name: Manifest and help
        run: |
          node -e '
            const m = require("./companion/manifest.json")
            const fail = (msg) => { console.log(`::error::${msg}`); process.exit(1) }
            if (JSON.stringify(m).includes("your-module-name")) fail("manifest still mentions your-module-name")
            if (!Array.isArray(m.products) || !m.products.length) fail("manifest products list is empty")
            if (m.runtime?.apiVersion !== "0.0.0") fail("manifest runtime.apiVersion must stay 0.0.0 (filled in by the build)")
            console.log(`manifest ${m.id}: ${m.manufacturer}: ${m.products.join(", ")}`)
          '
          test -f companion/HELP.md || { echo "::error::companion/HELP.md missing"; exit 1; }

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME}"
          # tags drop the -by-GC suffix of the module version (v3.0.0-beta.1 for 3.0.0-beta.1-by-GC)
          if [ "$tag" != "v$version" ] && [ "$tag" != "$version" ] && [ "$tag" != "v${version%-by-GC}" ]; then
            echo "::error::package.json version $version does not match tag $tag"; exit 1
          fi

      - name: Install
        run: yarn install --frozen-lockfile --non-interactive

      - name: '@companion-module/tools is new enough'
        run: |
          installed=$(node -p "JSON.parse(require('fs').readFileSync('node_modules/@companion-module/tools/package.json')).version")
          major=${installed%%.*}
          if [ "$major" -le 2 ]; then floor=2.8.0; elif [ "$major" -eq 3 ]; then floor=3.1.0; else floor=$installed; fi
          lowest=$(printf '%s\n%s\n' "$installed" "$floor" | sort -V | head -n1)
          if [ "$lowest" != "$floor" ]; then echo "::error::@companion-module/tools $installed is below $floor"; exit 1; fi
          echo "@companion-module/tools $installed (minimum $floor)"

      - name: Build and package
        run: yarn companion-module-build --output=pkg

      - name: Node.js of the module runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: The built module loads the way Companion loads it
        timeout-minutes: 1
        run: |
          # @companion-module/tools 3 writes pkg.tgz (folder casparcg-server/ inside); Companion imports main.js and
          # expects the instance class as the default export and UpgradeScripts as a named export (module API 2.x)
          mkdir -p built && tar -xzf pkg.tgz -C built
          dir=$(ls -d built/*/ | head -n1)
          node --input-type=module -e "
            const m = await import('./${dir}main.js')
            const fail = (msg) => { console.log('::error::' + msg); process.exit(1) }
            if (typeof m.default !== 'function') fail('main.js has no default-exported class')
            if (!Array.isArray(m.UpgradeScripts)) fail('main.js has no UpgradeScripts array')
            console.log('module loads on Node ' + process.version + ': ' + m.UpgradeScripts.length + ' upgrade script(s)')
          "
          node -e "
            const m = require('./${dir}companion/manifest.json')
            if (m.type !== 'connection') { console.log('::error::built manifest type is ' + m.type); process.exit(1) }
            console.log('built manifest: apiVersion ' + m.runtime.apiVersion + ', ' + m.runtime.type + ', version ' + m.version)
          "
